identifiability_semantics:
  DIRECTLY_AVAILABLE: "Der Zielwert oder der zu seiner Auswertung benoetigte Quelldatensatz ist in einer geprueften Primaerquelle oeffentlich und innerhalb einer dokumentierten Domaene vorhanden."
  DERIVABLE_FROM_AVAILABLE_PRIMARY_DATA: "Der Zielterm ist mit publizierten Gleichungen aus oeffentlich verfuegbaren Primaerdaten ohne frei gewaehlte Koeffizienten ableitbar; die Ableitung bleibt auf die Quellendomaene beschraenkt."
  NOT_IDENTIFIABLE_FROM_CURRENT_LITERATURE: "Im dokumentierten Primaerquellen- und Datensatz-Audit wurde keine vollstaendige oeffentliche Bestimmung gefunden. Dies ist eine Audit-Aussage und kein Beweis, dass die Groesse nirgends existiert."

unit_policy:
  pressure: "Pa"
  temperature: "K"
  density: "kg m^-3"
  diffusion: "m^2 s^-1"
  electrical_conductivity: "S m^-1"
  collision_rate: "s^-1"
  chemical_potential: "J mol^-1 when the source is molar; J per particle when explicitly stated"
  rules:
    - "Quelleneinheiten werden nur mit dimensionssicheren SI-Faktoren umgerechnet."
    - "Eine leere value-Zelle bei dataset- oder method-only-Eintraegen ist beabsichtigt und kein Nullwert."
    - "Bereiche werden als min..max in der jeweils durch das Feld definierten SI-Einheit notiert."
    - "Keine Interpolation ist erlaubt, solange interpolation_rule keine quellengestuetzte Regel nennt."
    - "extrapolation_allowed bleibt fuer alle gegenwaertigen Eintraege false."

validation_rules:
  - "coefficient_id muss eindeutig und nicht leer sein."
  - "quantity_type, evidence_class und confidence muessen aus den kontrollierten Vokabularen stammen."
  - "Literaturwerte muessen Quelle, Fundstelle, Einheit und Geltungsbereich besitzen."
  - "Methodenanker duerfen keinen erfundenen numerischen value enthalten."
  - "derived muss die Ableitung und den publizierten Ausgangswert in method oder data_location nennen."
  - "self_diffusion darf nicht als mutual_diffusion, maxwell_stefan, onsager oder electron_mobility umetikettiert werden."
  - "electrical_conductivity darf nicht ohne vollstaendigen Antwortoperator in D_e oder electron_mobility umgerechnet werden."
  - "usable_for_A35_real_Qeq darf erst true sein, wenn Definition, Unsicherheit, P-T-X-Domaene, Interpolation und Provenienz fuer den tatsaechlichen Closure-Term vollstaendig sind."
  - "Fehlende Werte bleiben leer; 0 ist nur bei einem publizierten physikalischen Nullwert zulaessig."

