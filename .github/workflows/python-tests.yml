name: Numerical regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage 3.80 F8a regressions
        run: python -m unittest -v test_stage3_80_f8_substructure_scan.py

      - name: Stage 3.94 multi-gate regressions
        run: python -m unittest -v test_stage3_94_multi_gate_closure.py

      - name: Stage 3.95A diagnostic charge theorem regressions
        run: python -m unittest -v test_stage3_95a_a35_diagnostic_charge_theorem.py

      - name: Stage 3.95D seismic reference-model audit regressions
        run: python -m unittest -v test_stage3_95d_h0_seismic_reference_audit.py

      - name: SCEM dataset acquisition helper regressions
        run: python -m unittest -v test_fetch_scem_2026_dataset.py

      - name: Stage 3.95E A35 closure capability audit regressions
        run: python -m unittest -v test_stage3_95e_a35_closure_capability_audit.py
